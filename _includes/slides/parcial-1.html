{%- assign s = include.s -%}
<section id="{{ s.id }}" class="clase evaluacion">
  {% include slides/etiqueta.html s=s %}
  <h2>{{ s.titulo }}</h2>
  <div class="columnas">
    <div class="columna">
      <ul class="temas compacto">
        {%- for tema in s.temas %}
        <li>{{ tema | markdownify | remove: '<p>' | remove: '</p>' | strip }}</li>
        {%- endfor %}
      </ul>
      <figure class="tarjeta venn">
        <img src="{{ '/assets/img/parcial-1-venn.png' | relative_url }}" width="257" height="307"
             alt="Diagrama de Venn de tres conjuntos (Seguridad, Educación y Economía) con los totales de cada región, tal como salió del notebook del parcial">
      </figure>
    </div>
    {% include slides/codigo.html codigo=s.codigo %}
  </div>
</section>
