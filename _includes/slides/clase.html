{%- assign s = include.s -%}
<section id="{{ s.id }}" class="clase">
  {% include slides/etiqueta.html s=s %}
  <h2>{{ s.titulo }}</h2>
  <div class="columnas">
    <ul class="temas">
      {%- for tema in s.temas %}
      <li>{{ tema | markdownify | remove: '<p>' | remove: '</p>' | strip }}</li>
      {%- endfor %}
    </ul>
    {% include slides/codigo.html codigo=s.codigo %}
  </div>
</section>
