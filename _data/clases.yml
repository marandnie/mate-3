# Contenido del carrusel, en orden.
#
# Cada elemento es una diapositiva:
#   id          ancla de la URL (/mate-3/#/clase-05)
#   numero      número de clase (para la etiqueta "Clase 05")
#   fecha       como se muestra
#   etiqueta    opcional: reemplaza a "Clase NN · fecha" arriba del título
#   titulo      título de la diapositiva
#   mapa        texto de la baldosa en el mapa (si falta, no aparece en el mapa)
#   sigla       opcional: reemplaza al número en la baldosa (P2, TP)
#   evaluacion  true en parciales y TP (se resaltan en amarillo)
#   temas       3 o 4 viñetas; acepta `código en línea` (con comillas en el YAML)
#   codigo      fragmento de código:
#                 origen  opcional; si está, marca que el código es de una entrega mía
#                 texto   el código (mejor si las líneas no pasan de ~50 caracteres)
#   include     opcional: diapositiva con HTML propio en _includes/slides/
#
# Las fechas salen de los nombres de las carpetas de cada clase.

