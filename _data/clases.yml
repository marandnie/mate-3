      import re

      texto = "Turnos: 16:00, 18:30 y 20:15"

      re.findall(r"(\d{2}):(\d{2})", texto)
      # [('16', '00'), ('18', '30'), ('20', '15')]

      re.sub(r":\d{2}", " hs", texto)
      # 'Turnos: 16 hs, 18 hs y 20 hs'

