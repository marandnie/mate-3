      def franja_horaria(row):
        s = re.split("\s|:", row)
        hora_recorrido = int(s[1])
        if 6 <= hora_recorrido <= 12:
          return "mañana"
        elif 12 < hora_recorrido <= 18:
          return "tarde"
        elif 18 < hora_recorrido <= 23:
          return "noche"
        else:
          return "madrugada"

      dataset["franja_horaria_recorrido"] = \
        dataset.fecha_origen_recorrido \
               .apply(franja_horaria)

