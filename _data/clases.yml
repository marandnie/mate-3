  codigo:
    origen: Del TP final
    texto: |
      def franja_horaria(row):
        s = re.split("\s|:", row)
        hora_recorrido = int(s[1])
        if 6 <= hora_recorrido <= 12:
          return "mañana"
        elif 12 < hora_recorrido <= 18:
          return "tarde"
        elif 18 < hora_recorrido <= 23:
          return "noche"
        else:
          return "madrugada"

      dataset["franja_horaria_recorrido"] = \
        dataset.fecha_origen_recorrido \
               .apply(franja_horaria)
  detalle:
    - id: tp-datos
      titulo: Preparación de los datos
      temas:
        - "**77.136 viajes** que salen de la estación 175, con **395 estaciones de destino** distintas."
        - "Duración: mediana de **18 minutos**, promedio de 30 y un máximo de 1422 (casi un día entero)."
        - "Género: el **99 %** de los viajes figura como NO INFORMADO (76.369). Solo 767 tienen el dato."
        - "Nueva columna `misma_estacion`: si la bici vuelve a donde salió."
      codigo:
        origen: Del TP final
        texto: |
          dataset = dataset[dataset.id_estacion_origen == 175]

          # pasar a "NO INFORMADO" los not a numbers de genero
          dataset.loc[dataset["genero_usuario"].isna(),
                      "genero_usuario"] = 'NO INFORMADO'

          def minutos_de_tiempo(row):
            s = re.split("\s|:", row)
            return int(s[2])*60 + int(s[3])

          dataset["duracion_minutos"] = \
            dataset.duracion_recorrido.apply(minutos_de_tiempo)

          dataset["misma_estacion"] = (
            dataset["id_estacion_origen"]
            == dataset["id_estacion_destino"])
