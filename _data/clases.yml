    - id: parcial-2-regex
      titulo: "Regex: aeropuerto y precio"
      bajada: >-
        Cada línea trae aeropuerto de origen, aeropuerto de destino, duración y precio.
        Había que quedarse con el origen y el precio.
      temas:
        - '`\s*` saltea los espacios al principio de la línea'
        - '`(\w{3})` es el primer grupo: el aeropuerto de origen'
        - '`;\w{3};\d*\.\d*;` pasa por el destino y la duración sin guardarlos'
        - '`(\d*\.\d*)` es el segundo grupo: el precio'
      codigo:
        origen: Del recuperatorio
        texto: |
          texto = """AEP;CNQ;95.45;680.00
                  EZE;IRJ;39.50;4780.00
                  JNI;COC;51.44;1160.00
                  LPG;AEP;66.26;7580.00
                  MDQ;GPO;18.85;720.00
                  FDO;RYO;26.49;340.00
          """
          p = re.compile(
              "\s*(\w{3});\w{3};\d*\.\d*;(\d*\.\d*)",
              re.MULTILINE)
          print(p.findall(texto))
      salida: |
        [('AEP', '680.00'), ('EZE', '4780.00'),
         ('JNI', '1160.00'), ('LPG', '7580.00'),
         ('MDQ', '720.00'), ('FDO', '340.00')]

