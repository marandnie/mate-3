- id: clase-10
  numero: 10
  fecha: 15/10/2021
  titulo: Clases, módulos y excepciones
  mapa: Clases
  temas:
    - "Clases y objetos: atributos, métodos y `__init__`"
    - Herencia
    - Módulos y paquetes
    - "Errores y excepciones: `try`, `except`, `finally` y `raise`"
  codigo:
    texto: |
      class Cuenta:
          def __init__(self, titular, saldo=0):
              self.titular = titular
              self.saldo = saldo

          def extraer(self, monto):
              if monto > self.saldo:
                  raise ValueError("Saldo insuficiente")
              self.saldo -= monto


      try:
          Cuenta("Ana", 100).extraer(500)
      except ValueError as error:
          print(error)  # Saldo insuficiente

