# Configuración de https://mandieto.com.ar/mate-3/
# Spec, plan y tareas: specs/002-mate3/
#
# Si la cambiás con `bundle exec jekyll serve` corriendo, reiniciá el servidor
# (este archivo no se recarga solo).

# --- Identidad de la página ---
title: "Matemática III, clase por clase"
author: Marina Nieto
description: >-
  Matemática III en la TPI de la UNSAM, clase por clase: Python, NumPy, Pandas,
  grafos con NetworkX, expresiones regulares y regresión lineal. Por Marina Nieto.
url: "https://mandieto.com.ar"
baseurl: "/mate-3"
lang: es-AR
locale: es_AR
timezone: America/Argentina/Buenos_Aires
repo: https://github.com/marandnie/mate-3
image:
  path: /assets/img/og-mate3.jpg
  width: 1200
  height: 675

# --- reveal.js ---
# Se pasan tal cual a Reveal.initialize() (ver _includes/script.html).
# Documentación: https://revealjs.com/config/
reveal:
  hash: true            # cada diapositiva tiene su URL (#/clase-05)
  controls: true        # flechas en pantalla
  controlsTutorial: true
  progress: true        # barra de progreso abajo
  slideNumber: "c/t"    # número actual / total
  center: true
  touch: true           # swipe en el celular
  loop: false
  transition: slide
  backgroundTransition: fade
  margin: 0.04
  minScale: 0.2
  maxScale: 2.0

# Tamaño del lienzo (se escala solo a la pantalla).
# En pantallas verticales se usa `vertical` (ver _includes/script.html).
lienzo:
  horizontal: { width: 1200, height: 760 }
  vertical: { width: 540, height: 1170 }

# --- Build ---
markdown: kramdown
highlighter: rouge

# Archivos que no se publican. En Jekyll 3 (el de GitHub Pages) esta lista
# reemplaza a la de por defecto, por eso se repite completa.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - README.md
  - LICENSE
  - package-lock.json
  - specs/
  # De reveal.js solo se publican dist/ y plugin/
  - node-modules/reveal.js-master/css/
  - node-modules/reveal.js-master/js/
  - node-modules/reveal.js-master/examples/
  - node-modules/reveal.js-master/test/
  - node-modules/reveal.js-master/demo.html
  - node-modules/reveal.js-master/index.html
  - node-modules/reveal.js-master/gulpfile.js
  - node-modules/reveal.js-master/package.json
  - node-modules/reveal.js-master/package-lock.json
  - node-modules/reveal.js-master/README.md
